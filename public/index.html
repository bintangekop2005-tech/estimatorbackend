<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Token Tracker</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f5f7fb;
            font-family: Arial, sans-serif;
            color: #172033;
        }

        .container {
            width: min(900px, calc(100% - 32px));
            margin: 40px auto;
        }

        h1 {
            margin-bottom: 6px;
        }

        .subtitle {
            color: #667085;
            margin-bottom: 25px;
        }

        .card {
            background: white;
            border: 1px solid #e4e7ec;
            border-radius: 16px;
            padding: 22px;
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 7px;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #d0d5dd;
            border-radius: 10px;
            font-size: 14px;
            font-family: inherit;
            margin-bottom: 16px;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 10px;
            background: #111827;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            opacity: .6;
        }

        .metrics {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        .metric {
            background: #f8fafc;
            border-radius: 10px;
            padding: 15px;
        }

        .metric-label {
            font-size: 12px;
            color: #667085;
        }

        .metric-value {
            font-size: 25px;
            font-weight: bold;
            margin-top: 5px;
        }

        .answer {
            background: #f8fafc;
            padding: 16px;
            border-radius: 10px;
            white-space: pre-wrap;
            line-height: 1.6;
            min-height: 100px;
        }

        .status {
            margin-top: 15px;
            padding: 12px;
            background: #f2f4f7;
            border-radius: 10px;
            font-size: 13px;
        }

        .error {
            background: #fef3f2;
            color: #b42318;
        }

        .success {
            background: #ecfdf3;
            color: #027a48;
        }

        @media (max-width: 700px) {
            .metrics {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Gemini Token Tracker</h1>

    <div class="subtitle">
        Dynamic token quota per user
    </div>


    <!-- INPUT -->

    <div class="card">

        <label>User ID</label>

        <input
            id="userId"
            value="user001"
        >


        <label>Pertanyaan</label>

        <textarea
            id="message"
            placeholder="Apa itu teknik industri?"
        ></textarea>


        <button
            id="sendButton"
            onclick="sendChat()"
        >
            Kirim ke Gemini
        </button>

    </div>


    <!-- TOKEN -->

    <div class="card">

        <h3>Token Usage</h3>

        <div class="metrics">

            <div class="metric">
                <div class="metric-label">
                    Limit
                </div>

                <div
                    id="limit"
                    class="metric-value"
                >
                    100
                </div>
            </div>


            <div class="metric">
                <div class="metric-label">
                    Used
                </div>

                <div
                    id="used"
                    class="metric-value"
                >
                    0
                </div>
            </div>


            <div class="metric">
                <div class="metric-label">
                    Input
                </div>

                <div
                    id="input"
                    class="metric-value"
                >
                    0
                </div>
            </div>


            <div class="metric">
                <div class="metric-label">
                    Output
                </div>

                <div
                    id="output"
                    class="metric-value"
                >
                    0
                </div>
            </div>

        </div>


        <div
            id="remaining"
            class="status"
        >
            Remaining: 100 tokens
        </div>

    </div>


    <!-- ANSWER -->

    <div class="card">

        <h3>AI Response</h3>

        <div
            id="answer"
            class="answer"
        >
            Belum ada jawaban.
        </div>

    </div>


    <!-- DEBUG -->

    <div class="card">

        <h3>Debug Response</h3>

        <pre
            id="debug"
            style="
                white-space: pre-wrap;
                word-break: break-word;
            "
        >Belum ada response.</pre>

    </div>

</div>


<script>

async function sendChat() {

    const userId =
        document
            .getElementById("userId")
            .value
            .trim();

    const message =
        document
            .getElementById("message")
            .value
            .trim();

    const button =
        document
            .getElementById("sendButton");

    const answer =
        document
            .getElementById("answer");

    const debug =
        document
            .getElementById("debug");

    const remaining =
        document
            .getElementById("remaining");


    if (!userId) {
        alert("User ID wajib diisi.");
        return;
    }


    if (!message) {
        alert("Pertanyaan wajib diisi.");
        return;
    }


    button.disabled = true;

    button.innerText =
        "Processing...";

    answer.innerText =
        "Mengirim request...";


    try {

        const response = await fetch(
            "/api/chat",
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({
                    user_id: userId,
                    message: message
                })
            }
        );


        /*
         * PENTING:
         * Jangan gunakan response.json()
         */

        const raw =
            await response.text();


        /*
         * Tampilkan response mentah
         */

        debug.innerText =
            "HTTP STATUS: " +
            response.status +
            "\n\n" +
            raw;


        /*
         * Coba parsing JSON
         */

        let data;

        try {

            data =
                JSON.parse(raw);

        } catch (e) {

            answer.innerText =
                "Server tidak mengembalikan JSON.";

            remaining.innerText =
                "HTTP " +
                response.status +
                ": " +
                raw;

            throw new Error(
                "Response server bukan JSON: " +
                raw
            );
        }


        /*
         * HTTP ERROR
         */

        if (!response.ok) {

            throw new Error(
                data.detail ||
                data.message ||
                "Server error"
            );

        }


        /*
         * QUOTA BLOCKED
         */

        if (data.blocked) {

            answer.innerText =
                data.message;

            updateMetrics(
                data.token
            );

            remaining.innerText =
                "Quota tidak mencukupi.";

            return;
        }


        /*
         * SUCCESS
         */

        answer.innerText =
            data.answer;

        updateMetrics(
            data.token
        );


        remaining.innerText =
            "Remaining: " +
            (
                data.token.remaining_after
                ?? 0
            ) +
            " tokens";

    }

    catch (error) {

        console.error(error);

        answer.innerText =
            "Error: " +
            error.message;

    }

    finally {

        button.disabled = false;

        button.innerText =
            "Kirim ke Gemini";

    }

}


function updateMetrics(token) {

    if (!token) {
        return;
    }


    document.getElementById("limit")
        .innerText =
        token.limit ?? 0;


    document.getElementById("used")
        .innerText =
        token.used_after ??
        token.used_before ??
        0;


    document.getElementById("input")
        .innerText =
        token.actual_input ??
        token.estimated_input ??
        0;


    document.getElementById("output")
        .innerText =
        token.actual_output ??
        0;

}

</script>

</body>
</html>
