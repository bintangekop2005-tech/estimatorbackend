<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        Gemini Token Tracker
    </title>


    <style>
        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            font-family:
                Arial,
                sans-serif;

            background:
                #f5f7fb;

            color:
                #172033;

        }


        .container {

            width:
                min(900px,
                    calc(100% - 32px));

            margin:
                40px auto;

        }


        h1 {

            margin-bottom:
                5px;

        }


        .subtitle {

            color:
                #667085;

            margin-bottom:
                25px;

        }


        .card {

            background:
                white;

            border:
                1px solid #e4e7ec;

            border-radius:
                16px;

            padding:
                22px;

            margin-bottom:
                18px;

            box-shadow:
                0 4px 15px rgba(0,
                    0,
                    0,
                    0.04);

        }


        label {

            display:
                block;

            font-weight:
                600;

            font-size:
                13px;

            margin-bottom:
                7px;

        }


        input,
        textarea {

            width:
                100%;

            padding:
                12px;

            border:
                1px solid #d0d5dd;

            border-radius:
                10px;

            font:
                inherit;

            margin-bottom:
                16px;

        }


        textarea {

            min-height:
                120px;

            resize:
                vertical;

        }


        button {

            width:
                100%;

            padding:
                13px;

            border:
                none;

            border-radius:
                10px;

            background:
                #111827;

            color:
                white;

            font-weight:
                bold;

            cursor:
                pointer;

        }


        button:disabled {

            opacity:
                0.6;

            cursor:
                not-allowed;

        }


        .metrics {

            display:
                grid;

            grid-template-columns:
                repeat(4,
                    1fr);

            gap:
                12px;

        }


        .metric {

            padding:
                16px;

            background:
                #f8fafc;

            border-radius:
                12px;

        }


        .metric-label {

            font-size:
                12px;

            color:
                #667085;

        }


        .metric-value {

            font-size:
                26px;

            font-weight:
                bold;

            margin-top:
                5px;

        }


        .remaining {

            margin-top:
                15px;

            padding:
                13px;

            border-radius:
                10px;

            background:
                #f8fafc;

        }


        .answer {

            background:
                #f8fafc;

            border-radius:
                10px;

            padding:
                16px;

            min-height:
                100px;

            white-space:
                pre-wrap;

            line-height:
                1.6;

        }


        .details {

            display:
                grid;

            grid-template-columns:
                repeat(2,
                    1fr);

            gap:
                10px;

        }


        .detail {

            background:
                #f8fafc;

            border-radius:
                10px;

            padding:
                13px;

        }


        .detail span {

            display:
                block;

            font-size:
                12px;

            color:
                #667085;

            margin-bottom:
                5px;

        }


        .detail strong {

            font-size:
                16px;

        }


        .status {

            margin-top:
                15px;

            padding:
                12px;

            border-radius:
                10px;

            background:
                #f2f4f7;

            font-size:
                13px;

        }


        .success {

            background:
                #ecfdf3;

            color:
                #027a48;

        }


        .error {

            background:
                #fef3f2;

            color:
                #b42318;

        }


        @media(max-width:700px) {

            .metrics {

                grid-template-columns:
                    repeat(2,
                        1fr);

            }


            .details {

                grid-template-columns:
                    1fr;

            }

        }
    </style>

</head>


<body>


    <div class="container">


        <h1>
            Gemini Token Tracker
        </h1>


        <div class="subtitle">

            Dynamic output token
            berdasarkan quota user

        </div>


        <!-- CHAT -->

        <div class="card">

            <label>
                User ID
            </label>

            <input id="userId" value="user001">


            <label>
                Pertanyaan
            </label>

            <textarea id="message" placeholder="Apa itu teknik industri?"></textarea>


            <button id="sendButton" onclick="sendChat()">

                Kirim ke Gemini

            </button>

        </div>


        <!-- TOKEN -->

        <div class="card">

            <h3>
                Token Usage
            </h3>


            <div class="metrics">


                <div class="metric">

                    <div class="metric-label">
                        Limit
                    </div>

                    <div id="limit" class="metric-value">
                        100
                    </div>

                </div>


                <div class="metric">

                    <div class="metric-label">
                        Used
                    </div>

                    <div id="used" class="metric-value">
                        0
                    </div>

                </div>


                <div class="metric">

                    <div class="metric-label">
                        Input
                    </div>

                    <div id="input" class="metric-value">
                        0
                    </div>

                </div>


                <div class="metric">

                    <div class="metric-label">
                        Output
                    </div>

                    <div id="output" class="metric-value">
                        0
                    </div>

                </div>


            </div>


            <div id="remaining" class="remaining">

                Remaining:
                <strong>
                    100
                </strong>
                tokens

            </div>


            <div id="status" class="status">

                Ready

            </div>

        </div>


        <!-- ANSWER -->

        <div class="card">

            <h3>
                AI Response
            </h3>


            <div id="answer" class="answer">

                Belum ada jawaban.

            </div>

        </div>


        <!-- DETAILS -->

        <div class="card">

            <h3>
                Token Details
            </h3>


            <div class="details">


                <div class="detail">

                    <span>
                        Estimated Input
                    </span>

                    <strong id="estimatedInput">
                        0
                    </strong>

                </div>


                <div class="detail">

                    <span>
                        Max Output Allowed
                    </span>

                    <strong id="maxOutput">
                        0
                    </strong>

                </div>


                <div class="detail">

                    <span>
                        Actual Input
                    </span>

                    <strong id="actualInput">
                        0
                    </strong>

                </div>


                <div class="detail">

                    <span>
                        Actual Output
                    </span>

                    <strong id="actualOutput">
                        0
                    </strong>

                </div>


                <div class="detail">

                    <span>
                        Actual Total
                    </span>

                    <strong id="actualTotal">
                        0
                    </strong>

                </div>


                <div class="detail">

                    <span>
                        Remaining After
                    </span>

                    <strong id="remainingAfter">
                        100
                    </strong>

                </div>


            </div>

        </div>


    </div>


    <script>


        async function sendChat() {


            const userId =
                document
                    .getElementById(
                        "userId"
                    )
                    .value
                    .trim();


            const message =
                document
                    .getElementById(
                        "message"
                    )
                    .value
                    .trim();


            const button =
                document.getElementById(
                    "sendButton"
                );


            const answer =
                document.getElementById(
                    "answer"
                );


            const status =
                document.getElementById(
                    "status"
                );


            if (!userId) {

                alert(
                    "User ID wajib diisi."
                );

                return;

            }


            if (!message) {

                alert(
                    "Pertanyaan wajib diisi."
                );

                return;

            }


            button.disabled =
                true;


            button.innerText =
                "Processing...";


            answer.innerText =
                "Menghitung token...";


            status.className =
                "status";


            status.innerText =
                "Processing request...";


            try {


                const response =
                    await fetch(
                        "/api/chat",
                        {

                            method:
                                "POST",

                            headers: {

                                "Content-Type":
                                    "application/json"

                            },

                            body:
                                JSON.stringify({

                                    user_id:
                                        userId,

                                    message:
                                        message

                                })

                        }
                    );


                /*
                 * Baca sebagai text terlebih dahulu
                 * agar error Vercel tidak menghasilkan
                 * "Unexpected token A".
                 */

                const raw =
                    await response.text();


                let data;


                try {

                    data =
                        JSON.parse(
                            raw
                        );

                }

                catch {

                    throw new Error(

                        "Server tidak mengembalikan JSON.\n\n" +

                        "HTTP " +
                        response.status +

                        "\n\n" +

                        raw

                    );

                }


                if (!response.ok) {

                    throw new Error(

                        data.detail ||

                        data.message ||

                        "Server error"

                    );

                }


                /*
                 * QUOTA BLOCKED
                 */

                if (data.blocked) {


                    answer.innerText =
                        data.message;


                    updateMetrics(
                        data.token
                    );


                    status.className =
                        "status error";


                    status.innerText =
                        "Request diblokir.";


                    return;

                }


                /*
                 * SUCCESS
                 */

                answer.innerText =
                    data.answer;


                updateMetrics(
                    data.token
                );


                status.className =
                    "status success";


                status.innerText =
                    "Request berhasil.";

            }


            catch (error) {


                console.error(
                    error
                );


                answer.innerText =
                    error.message;


                status.className =
                    "status error";


                status.innerText =
                    "Request gagal.";

            }


            finally {


                button.disabled =
                    false;


                button.innerText =
                    "Kirim ke Gemini";

            }

        }


        /* ============================================================
           UPDATE TOKEN UI
           ============================================================ */

        function updateMetrics(
            token
        ) {


            if (!token) {

                return;

            }


            document
                .getElementById(
                    "limit"
                )
                .innerText =
                token.limit ?? 0;


            document
                .getElementById(
                    "used"
                )
                .innerText =

                token.used_after ??

                token.used_before ??

                0;


            document
                .getElementById(
                    "input"
                )
                .innerText =

                token.actual_input ??

                token.estimated_input ??

                0;


            document
                .getElementById(
                    "output"
                )
                .innerText =

                token.actual_output ??

                0;


            document
                .getElementById(
                    "remaining"
                )
                .innerHTML =

                "Remaining: <strong>" +

                (
                    token.remaining_after ??

                    token.remaining_before ??

                    0
                )

                +

                "</strong> tokens";


            document
                .getElementById(
                    "estimatedInput"
                )
                .innerText =

                token.estimated_input ??

                0;


            document
                .getElementById(
                    "maxOutput"
                )
                .innerText =

                token.max_output_allowed ??

                0;


            document
                .getElementById(
                    "actualInput"
                )
                .innerText =

                token.actual_input ??

                0;


            document
                .getElementById(
                    "actualOutput"
                )
                .innerText =

                token.actual_output ??

                0;


            document
                .getElementById(
                    "actualTotal"
                )
                .innerText =

                token.actual_total ??

                0;


            document
                .getElementById(
                    "remainingAfter"
                )
                .innerText =

                token.remaining_after ??

                token.remaining_before ??

                0;

        }

    </script>


</body>

</html>
