<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gemini Token Tracker</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f7fb;
            color: #1f2937;
        }

        .container {
            width: 92%;
            max-width: 900px;
            margin: 40px auto;
        }

        .header {
            margin-bottom: 24px;
        }

        .header h1 {
            margin: 0 0 8px;
            font-size: 30px;
        }

        .header p {
            margin: 0;
            color: #667085;
        }

        .card {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 18px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.05);
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        input,
        textarea {
            width: 100%;
            border: 1px solid #d0d5dd;
            border-radius: 10px;
            padding: 12px 14px;
            font-family: inherit;
            font-size: 15px;
            outline: none;
        }

        input:focus,
        textarea:focus {
            border-color: #667085;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        .button {
            width: 100%;
            margin-top: 14px;
            padding: 13px;
            border: none;
            border-radius: 10px;
            background: #111827;
            color: white;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }

        .button:hover {
            background: #1f2937;
        }

        .button:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }

        .metrics {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        .metric {
            background: #f8fafc;
            border: 1px solid #eef2f6;
            border-radius: 12px;
            padding: 16px;
        }

        .metric-title {
            color: #667085;
            font-size: 12px;
            font-weight: 600;
        }

        .metric-value {
            margin-top: 6px;
            font-size: 25px;
            font-weight: 800;
        }

        .remaining-box {
            margin-top: 18px;
            padding: 14px;
            border-radius: 10px;
            background: #f8fafc;
            font-weight: 600;
        }

        .answer {
            white-space: pre-wrap;
            line-height: 1.7;
            font-size: 15px;
        }

        .details {
            line-height: 1.9;
            font-size: 14px;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid #f0f2f5;
            padding: 7px 0;
        }

        .detail-row:last-child {
            border-bottom: none;
        }

        .detail-label {
            color: #667085;
        }

        .detail-value {
            font-weight: 700;
        }

        .status {
            display: inline-block;
            padding: 5px 9px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            background: #f2f4f7;
            color: #344054;
        }

        .error {
            background: #fef3f2;
            color: #b42318;
            border: 1px solid #fecdca;
        }

        .success {
            background: #ecfdf3;
            color: #027a48;
            border: 1px solid #abefc6;
        }

        .warning {
            background: #fffaeb;
            color: #b54708;
            border: 1px solid #fedf89;
        }

        @media (max-width: 700px) {

            .container {
                width: 94%;
                margin: 25px auto;
            }

            .metrics {
                grid-template-columns: repeat(2, 1fr);
            }

            .header h1 {
                font-size: 25px;
            }
        }
    </style>

</head>


<body>

    <div class="container">

        <!-- HEADER -->

        <div class="header">

            <h1>
                Gemini Token Tracker
            </h1>

            <p>
                Dynamic token quota per user
            </p>

        </div>


        <!-- INPUT -->

        <div class="card">

            <label for="userId">
                User ID
            </label>

            <input id="userId" type="text" value="user001" placeholder="Contoh: user001">

            <br><br>

            <label for="message">
                Chat
            </label>

            <textarea id="message" placeholder="Apa itu teknik industri?"></textarea>

            <button id="sendButton" class="button" onclick="sendChat()">
                Kirim ke Gemini
            </button>

        </div>


        <!-- TOKEN METRICS -->

        <div class="card">

            <div class="metrics">

                <div class="metric">

                    <div class="metric-title">
                        LIMIT
                    </div>

                    <div id="limit" class="metric-value">
                        300
                    </div>

                </div>


                <div class="metric">

                    <div class="metric-title">
                        USED
                    </div>

                    <div id="used" class="metric-value">
                        0
                    </div>

                </div>


                <div class="metric">

                    <div class="metric-title">
                        INPUT
                    </div>

                    <div id="input" class="metric-value">
                        0
                    </div>

                </div>


                <div class="metric">

                    <div class="metric-title">
                        OUTPUT
                    </div>

                    <div id="output" class="metric-value">
                        0
                    </div>

                </div>

            </div>


            <div id="remainingBox" class="remaining-box">
                Remaining: 300 tokens
            </div>

        </div>


        <!-- AI ANSWER -->

        <div class="card">

            <h3>
                AI Response
            </h3>

            <div id="answer" class="answer">
                Belum ada jawaban.
            </div>

        </div>


        <!-- TOKEN DETAILS -->

        <div class="card">

            <h3>
                Token Details
            </h3>

            <div id="details" class="details">

                <div class="detail-row">
                    <span class="detail-label">
                        Estimated Input
                    </span>

                    <span class="detail-value">
                        0
                    </span>
                </div>

            </div>

        </div>


    </div>


    <script>


        // ============================================================
        // SEND CHAT
        // ============================================================

        async function sendChat() {

            const userId =
                document
                    .getElementById("userId")
                    .value
                    .trim();


            const message =
                document
                    .getElementById("message")
                    .value
                    .trim();


            const button =
                document
                    .getElementById("sendButton");


            const answer =
                document
                    .getElementById("answer");


            // --------------------------------------------------------
            // VALIDATION
            // --------------------------------------------------------

            if (!userId) {

                alert(
                    "User ID wajib diisi."
                );

                return;
            }


            if (!message) {

                alert(
                    "Chat wajib diisi."
                );

                return;
            }


            // --------------------------------------------------------
            // LOADING
            // --------------------------------------------------------

            button.disabled = true;

            button.innerText =
                "Processing...";


            answer.innerText =
                "Gemini sedang memproses...";


            try {

                // ----------------------------------------------------
                // REQUEST
                // ----------------------------------------------------

                const response =
                    await fetch(
                        "/api/chat",
                        {

                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({

                                user_id:
                                    userId,

                                message:
                                    message

                            })

                        }
                    );


                // ----------------------------------------------------
                // READ RESPONSE SAFELY
                // ----------------------------------------------------

                const contentType =
                    response.headers.get(
                        "content-type"
                    );


                let data;


                if (
                    contentType &&
                    contentType.includes(
                        "application/json"
                    )
                ) {

                    data =
                        await response.json();

                } else {

                    const text =
                        await response.text();

                    throw new Error(
                        text ||
                        `HTTP ${response.status}`
                    );

                }


                // ----------------------------------------------------
                // ERROR
                // ----------------------------------------------------

                if (!response.ok) {

                    throw new Error(
                        data.message ||
                        data.detail ||
                        "Server error"
                    );

                }


                // ----------------------------------------------------
                // BLOCKED
                // ----------------------------------------------------

                if (data.blocked) {

                    answer.innerText =
                        data.message ||
                        "Request diblokir.";

                    answer.className =
                        "answer warning";


                    if (data.token) {

                        updateMetrics(
                            data.token
                        );

                    }

                    return;
                }


                // ----------------------------------------------------
                // SUCCESS
                // ----------------------------------------------------

                answer.className =
                    "answer";


                answer.innerText =
                    data.answer ||
                    "Gemini tidak memberikan jawaban.";


                if (data.token) {

                    updateMetrics(
                        data.token
                    );

                }

            }


            catch (error) {

                console.error(
                    error
                );


                answer.className =
                    "answer error";


                answer.innerText =
                    "Error: " +
                    error.message;

            }


            finally {

                button.disabled =
                    false;

                button.innerText =
                    "Kirim ke Gemini";

            }

        }


        // ============================================================
        // UPDATE METRICS
        // ============================================================

        function updateMetrics(token) {


            const limit =
                token.limit ?? 100;


            const used =
                token.used_after ??
                token.used_before ??
                0;


            const input =
                token.actual_input ??
                token.estimated_input ??
                0;


            const output =
                token.actual_output ??
                0;


            const remaining =
                token.remaining_after ??
                token.remaining_before ??
                0;


            // --------------------------------------------------------
            // TOP METRICS
            // --------------------------------------------------------

            document
                .getElementById("limit")
                .innerText =
                limit;


            document
                .getElementById("used")
                .innerText =
                used;


            document
                .getElementById("input")
                .innerText =
                input;


            document
                .getElementById("output")
                .innerText =
                output;


            // --------------------------------------------------------
            // REMAINING
            // --------------------------------------------------------

            document
                .getElementById("remainingBox")
                .innerText =
                "Remaining: " +
                remaining +
                " tokens";


            // --------------------------------------------------------
            // TOKEN DETAILS
            // --------------------------------------------------------

            document
                .getElementById("details")
                .innerHTML = `

            <div class="detail-row">

                <span class="detail-label">
                    Estimated Input
                </span>

                <span class="detail-value">
                    ${token.estimated_input ?? 0}
                </span>

            </div>


            <div class="detail-row">

                <span class="detail-label">
                    Max Output Allowed
                </span>

                <span class="detail-value">
                    ${token.max_output_allowed ?? 0}
                </span>

            </div>


            <div class="detail-row">

                <span class="detail-label">
                    Actual Input
                </span>

                <span class="detail-value">
                    ${token.actual_input ?? 0}
                </span>

            </div>


            <div class="detail-row">

                <span class="detail-label">
                    Actual Output
                </span>

                <span class="detail-value">
                    ${token.actual_output ?? 0}
                </span>

            </div>


            <div class="detail-row">

                <span class="detail-label">
                    Actual Total
                </span>

                <span class="detail-value">
                    ${token.actual_total ?? 0}
                </span>

            </div>


            <div class="detail-row">

                <span class="detail-label">
                    Used After
                </span>

                <span class="detail-value">
                    ${token.used_after ?? 0}
                </span>

            </div>


            <div class="detail-row">

                <span class="detail-label">
                    Remaining
                </span>

                <span class="detail-value">
                    ${token.remaining_after ??
                token.remaining_before ??
                0}
                </span>

            </div>

        `;

        }


    </script>

</body>

</html>
